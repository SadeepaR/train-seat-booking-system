version: '3.8'

services:
  # 1. PostgreSQL Database Service configured with btree_gist extension for Range Exclusion Constraints
  postgres:
    image: postgres:16-alpine
    container_name: train_postgres
    environment:
      - POSTGRES_DB=train_booking
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d train_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: train_backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/train_booking
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React Vite Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: train_frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://backend:5001
    depends_on:
      - backend

volumes:
  postgres_data:
